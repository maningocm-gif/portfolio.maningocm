<title>Chariza Mae B. Maningo · Portfolio</title>
<style>
  :root { --bg:#17100c; --cream:#eee1d0; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--cream); font-family:Arial, Helvetica, sans-serif; }
  .portfolio { position:relative; width:100%; max-width:1537px; margin:0 auto; line-height:0; }
  .portfolio > img { display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }
  /* Invisible interaction layer: it does not alter the artwork. */
  .hotspot { position:absolute; display:block; z-index:2; background:transparent; border:0; padding:0; cursor:pointer; }
  .hotspot:focus-visible { outline:2px solid rgba(238,225,208,.9); outline-offset:3px; }
  .target { position:absolute; left:0; width:1px; height:1px; }
  .contact-email { top:94.9%; left:5.0%; width:16%; height:2.0%; }
  .contact-linkedin { top:96.1%; left:5.0%; width:18%; height:1.7%; }
  .back-top { position:fixed; right:18px; bottom:18px; z-index:20; width:1px; height:1px; opacity:0; overflow:hidden; }
  .sr-nav { position:fixed; top:0; left:0; z-index:30; transform:translateY(-120%); }
  .sr-nav:focus-within { transform:translateY(0); }
  .sr-nav a { display:inline-block; padding:8px 12px; background:#17100c; color:#eee1d0; text-decoration:none; font:12px/1 Arial,sans-serif; }
  @media (max-width:600px) {
    .portfolio { width:100%; }
    /* Keep the supplied artwork intact; no redesign/reflow is applied. */
  }
</style>
</head>
